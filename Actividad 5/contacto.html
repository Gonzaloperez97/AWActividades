<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Marcos Álvarez</title>
</head>
<body>
    <h1>Formulario de Contacto</h1>

    <p>¿Listo para volverte más fuerte? Completa el siguiente formulario contándome un poco sobre tu experiencia previa entrenando y me pondré en contacto contigo a la brevedad para que empecemos a trabajar en tus objetivos.</p>

    <form action="#" method="post">
        <label for="nombre">Nombre completo:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="correo">Correo electrónico:</label><br>
        <input type="email" id="correo" name="correo" required><br><br>

        <label for="experiencia">Nivel de experiencia:</label><br>
        <select id="experiencia" name="experiencia">
            <option value="principiante">Principiante (Recién empiezo)</option>
            <option value="intermedio">Intermedio (Ya conozco los básicos)</option>
            <option value="avanzado">Avanzado (Busco competir)</option>
        </select><br><br>

        <label for="mensaje">Mensaje o consulta sobre tus levantamientos:</label><br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="40" required></textarea><br><br>

        <input type="submit" value="Enviar Consulta">
    </form>

    <br>
    <a href="índice.html">Volver a la página principal</a>
</body>
</html>
